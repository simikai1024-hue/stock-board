<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>미국장 달의 검 · 트랙1 & 트랙3 실시간 신호판</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #F3F8FF;
    --card: #FFFFFF;
    --ink: #0F172A;
    --muted: #64748B;
    --line: #E2E8F0;
    --sky: #0284C7;
    --sky-soft: #E0F2FE;
    --violet: #7C3AED;
    --violet-soft: #F3E8FF;
    --mint: #059669;
    --mint-soft: #DCFCE7;
    --coral: #E11D48;
    --coral-soft: #FFE4E6;
    --amber: #D97706;
    --amber-soft: #FEF3C7;
    --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
  body {
    background: linear-gradient(180deg, #EAF4FF 0%, #FFFDF8 52%, #F3F8FF 100%);
    min-height: 100vh;
    color: var(--ink);
    padding: 14px;
    max-width: 1120px;
    margin: 0 auto;
    line-height: 1.45;
  }

  /* 상단 슬림 헤더 */
  .top-header {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    background: linear-gradient(135deg, #FFFFFF 0%, #F0F9FF 100%);
    border: 1px solid #BAE6FD;
    border-radius: 18px;
    padding: 13px 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .brand-wrap { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .brand-title {
    font-size: 19px; font-weight: 900; letter-spacing: -0.4px;
    background: linear-gradient(90deg, #0284C7, #7C3AED);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .ver-pill {
    font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
    background: var(--violet-soft); color: var(--violet);
  }
  .header-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .clock-chip {
    font-size: 12.5px; font-weight: 800; color: #334155;
    background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 999px; padding: 5px 11px;
  }
  .live-chip {
    font-size: 12.5px; font-weight: 800; padding: 5px 11px; border-radius: 999px;
    background: var(--amber-soft); color: var(--amber);
  }
  .live-chip.ok { background: var(--mint-soft); color: var(--mint); }
  .mini-btn {
    border: 1px solid #CBD5E1; background: #FFFFFF; color: #334155;
    border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 800;
    cursor: pointer; transition: 0.15s;
  }
  .mini-btn:hover { background: #F1F5F9; transform: translateY(-1px); }
  .mini-btn.on { background: var(--mint-soft); border-color: #34D399; color: var(--mint); }

  /* 1줄 계좌/보유 상태 스트립 */
  .pos-strip {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 16px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    font-size: 13.5px; font-weight: 800; color: #334155;
  }
  .pos-badge {
    padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 900;
    background: var(--mint-soft); color: var(--mint);
  }
  .pos-badge.holding { background: var(--amber-soft); color: #B45309; }
  .pos-badge.halting { background: var(--coral-soft); color: var(--coral); }

  /* 실시간 분석 중 / 홀트 배너 (평소 숨김) */
  @keyframes softPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.25); }
    50% { box-shadow: 0 0 0 8px rgba(124, 58, 237, 0.06); }
  }
  .live-alert-banner {
    display: none;
    background: linear-gradient(135deg, #EEF2FF 0%, #FFF1F2 100%);
    border: 1.5px solid #A78BFA; border-radius: 15px;
    padding: 12px 16px; margin-bottom: 12px;
    animation: softPulse 1.8s infinite;
  }
  .live-alert-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .live-alert-title { font-size: 14.5px; font-weight: 900; color: #5B21B6; }
  .live-alert-timer { font-size: 12.5px; font-weight: 900; padding: 3px 10px; border-radius: 999px; background: #FFFFFF; color: #7C3AED; border: 1px solid #DDD6FE; }
  .live-alert-body { font-size: 13.5px; font-weight: 700; color: #334155; margin-top: 5px; }

  /* 핵심 하이라이트 카드: 오늘 뜬 트랙1 · 트랙3 요약 */
  .highlight-card {
    background: linear-gradient(135deg, #FFFFFF 0%, #FAF5FF 55%, #F0FDF4 100%);
    border: 1.5px solid #DDD6FE;
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .hl-head {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    margin-bottom: 10px;
  }
  .hl-title { font-size: 15.5px; font-weight: 900; color: #1E293B; }
  .hl-counts { display: flex; gap: 6px; flex-wrap: wrap; }
  .cnt-chip {
    font-size: 12px; font-weight: 900; padding: 3px 10px; border-radius: 999px;
    background: #F1F5F9; color: #475569;
  }
  .cnt-chip.t1 { background: var(--sky-soft); color: var(--sky); }
  .cnt-chip.t3 { background: var(--violet-soft); color: var(--violet); }
  .cnt-chip.buy { background: var(--mint-soft); color: var(--mint); }

  .hl-strip {
    display: flex; gap: 9px; flex-wrap: wrap;
  }
  .hl-empty {
    font-size: 13px; font-weight: 700; color: var(--muted);
    background: rgba(255,255,255,0.75); border: 1px dashed #CBD5E1;
    border-radius: 12px; padding: 11px 14px; width: 100%;
  }
  .hl-item {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: #FFFFFF; border: 1.5px solid #E2E8F0; border-radius: 13px;
    padding: 8px 12px; cursor: pointer; transition: 0.15s;
    box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
  }
  .hl-item:hover { transform: translateY(-1px); border-color: #93C5FD; }
  .hl-item.t3 { border-color: #C4B5FD; background: linear-gradient(135deg, #FFFFFF, #FAF5FF); }
  .hl-item.t1 { border-color: #6EE7B7; background: linear-gradient(135deg, #FFFFFF, #ECFDF5); }
  .hl-time { font-size: 12px; font-weight: 900; color: #64748B; }
  .hl-sym { font-size: 15.5px; font-weight: 900; color: #0F172A; }
  .hl-gain { font-size: 12.5px; font-weight: 900; color: var(--coral); }
  .hl-gain.neg { color: var(--sky); }

  /* 트랙 & 판정 배지 */
  .trk-badge {
    display: inline-block; font-size: 11.5px; font-weight: 900;
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;

  .trk-1 { background: var(--sky-soft); color: #0369A1; }
  .trk-3 { background: linear-gradient(90deg, #8B5CF6, #EC4899); color: #FFFFFF; }
  .trk-2 { background: var(--amber-soft); color: #B45309; }

  .dec-badge {
    display: inline-block; font-size: 11.5px; font-weight: 900;

  /* 필터 바 */
  .bar-row {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    margin-bottom: 10px;
  }
  .tab-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab-btn {
    border: 1px solid #CBD5E1; background: #FFFFFF; color: #475569;
    border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 800;
    cursor: pointer; transition: 0.15s;
  }
  .tab-btn:hover { background: #F8FAFC; }
  .tab-btn.active {
    background: linear-gradient(90deg, #0284C7, #6366F1);
    color: #FFFFFF; border-color: transparent;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
  }
  .sort-btn {
    border: 1px solid #CBD5E1; background: #FFFFFF; color: #334155;
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 800;
    cursor: pointer;
  }

  /* 메인 타임라인 리스트 카드 */
  .list-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .date-divider {
    background: linear-gradient(90deg, #EFF6FF, #FAF5FF);
    color: #334155; font-size: 12.5px; font-weight: 900;
    padding: 7px 16px; border-top: 1px solid #E2E8F0; border-bottom: 1px solid #E2E8F0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .date-divider:first-child { border-top: none; }

  .sig-row {
    display: grid;
    grid-template-columns: 96px 96px 190px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    border-bottom: 1px solid #F1F5F9;
    cursor: pointer;
    transition: background 0.12s;
  }
  .sig-row:last-child { border-bottom: none; }
  .sig-row:hover { background: #F8FAFC; }
  .sig-row.is-buy { background: linear-gradient(90deg, #F0FDF4 0%, #FFFFFF 45%); }
  .sig-row.is-t3 { background: linear-gradient(90deg, #FAF5FF 0%, #FFFFFF 45%); }
  .sig-row.is-pass { opacity: 0.86; }

  .col-time .kst { font-size: 14px; font-weight: 900; color: #0F172A; }
  .col-time .et { font-size: 11.5px; font-weight: 700; color: #94A3B8; }
  .col-sym .sym-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .col-sym .sym { font-size: 16px; font-weight: 900; color: #0F172A; }
  .col-sym .ex { font-size: 11px; font-weight: 800; color: #0284C7; background: #E0F2FE; padding: 1px 6px; border-radius: 5px; }
  .col-sym .px { font-size: 12px; font-weight: 800; color: #475569; margin-top: 2px; }
  .col-reason { font-size: 13px; font-weight: 700; color: #334155; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .col-act { display: flex; align-items: center; gap: 6px; }
  .chart-btn {
    border: 1px solid #BAE6FD; background: #F0F9FF; color: #0369A1;
    border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 900;
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .chart-btn:hover { background: #E0F2FE; }

  /* 상세 전문 모달 */
  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(3px); z-index: 999; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-bg.open { display: flex; }
  .modal-box {
    background: #FFFFFF; border-radius: 18px; max-width: 680px; width: 100%; max-height: 82vh;
    overflow-y: auto; padding: 20px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.22);
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .modal-title { font-size: 18px; font-weight: 900; color: #0F172A; }
  .modal-close { border: none; background: #F1F5F9; color: #475569; border-radius: 999px; width: 32px; height: 32px; font-size: 16px; font-weight: 900; cursor: pointer; }
  .modal-meta { font-size: 13px; font-weight: 800; color: #64748B; margin-bottom: 10px; }
  .modal-reason { background: #F8FAFC; border-left: 4px solid #6366F1; border-radius: 10px; padding: 12px 14px; font-size: 14px; font-weight: 800; color: #1E293B; margin-bottom: 12px; }
  .modal-full { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.65; color: #334155; white-space: pre-wrap; }

  @media (max-width: 760px) {
    body { padding: 10px; }
    .sig-row {
      grid-template-columns: 78px 1fr auto;
      gap: 6px 8px;
      padding: 10px 12px;
    }
    .col-trk { grid-column: 1 / 2; }
    .col-sym { grid-column: 2 / 3; }
    .col-act { grid-column: 3 / 4; }
    .col-reason { grid-column: 1 / 4; font-size: 12.5px; }
  }
</style>
</head>
<body>

  <!-- 상단 슬림 헤더 -->
  <div class="top-header">
    <div class="brand-wrap">
      <div class="brand-title">🇺🇸 미국장 달의 검 · 트랙1 & 트랙3 신호판</div>
      <span class="ver-pill">v23 LIVE</span>
    </div>
    <div class="header-tools">
      <span class="clock-chip" id="dualClockLbl">🇰🇷 --:-- KST · 🇺🇸 --:-- ET</span>

  <!-- 1줄 보유 · 계좌 상태 -->

  <!-- 실시간 심문 / 홀트 진행 중 배너 (평소 숨김) -->
  <div class="live-alert-banner" id="liveAlertBanner">
    <div class="live-alert-top">

  <!-- 오늘 뜬 트랙1 · 트랙3 핵심 포착 스트립 (시간순) -->
  <div class="highlight-card">
    <div class="hl-head">
      <div class="hl-title" id="hlTitle">⚡ 오늘 뜬 트랙1 · 트랙3 핵심 신호 (발생 순서대로)</div>
      <div class="hl-counts">
        <span class="cnt-chip t3" id="cntT3">🟣 트랙3: 0건</span>
        <span class="cnt-chip buy" id="cntT1Buy">🔵 트랙1 BUY: 0건</span>
        <span class="cnt-chip t1" id="cntT1All">심사 총 0건</span>
      </div>
    </div>
    <div class="hl-strip" id="hlStrip">

  <!-- 상세 보기 모달 -->

<script>
const BROKER_WSS = "wss://broker.emqx.io:8084/mqtt";
const TOPIC_US_STATE = "us_whale_nblm_board_2026/state";
const TOPIC_US_LIVE  = "us_whale_nblm_board_2026/live";

let filterMode = "all"; // all | hot | track3 | track1
let sortAsc = false;    // false: 가장 최신 신호가 맨 위(기본), true: 발생순(오전→오후)
let cachedState = null;
let soundEnabled = false;
let audioCtx = null;
let analyzingStartMs = 0;
let isAnalyzing = false;
let haltStartMs = 0;
let isHalting = false;
const seenLiveIds = new Set();

/* 듀얼 시계 & 경과 초시계 */
function tickClocks() {
  try {
    const now = new Date();
    const kst = now.toLocaleTimeString("en-GB", { timeZone: "Asia/Seoul", hour12: false }).slice(0, 5);
    const et = now.toLocaleTimeString("en-GB", { timeZone: "America/New_York", hour12: false }).slice(0, 5);
    document.getElementById("dualClockLbl").innerText = `🇰🇷 ${kst} KST · 🇺🇸 ${et} ET`;
    if (isAnalyzing && analyzingStartMs > 0) {
      const s = Math.max(0, Math.floor((Date.now() - analyzingStartMs) / 1000));
      document.getElementById("liveAlertTimer").innerText = `⏱️ ${s}초 경과`;
    } else if (isHalting && haltStartMs > 0) {
      const s = Math.max(0, Math.floor((Date.now() - haltStartMs) / 1000));
      document.getElementById("liveAlertTimer").innerText = `⏸️ 홀트 ${s}초 대기`;
    }
  } catch (e) {}
}
setInterval(tickClocks, 1000);
tickClocks();

function toggleSound() {
  soundEnabled = !soundEnabled;
  if (soundEnabled && !audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  const btn = document.getElementById("soundBtn");
  btn.classList.toggle("on", soundEnabled);
  btn.innerText = soundEnabled ? "🔔 알림음 ON" : "🔔 알림음 OFF";
  if (soundEnabled) playChime(true);
}

function playChime(isBuy) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const notes = isBuy ? [523.25, 659.25, 783.99, 1046.5] : [440, 554.37];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = f;
      const t = audioCtx.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.14, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0008, t + 0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.36);
    });
  } catch (e) {}
}

function detectTrack(v) {
  const explicit = String(v.track || "").toUpperCase();
  if (explicit === "TRACK3") return "TRACK3";
  if (explicit === "TRACK2") return "TRACK2";
  if (explicit === "TRACK1") return "TRACK1";
  const txt = `${v.engine || ""} ${v.catalyst_hint || ""} ${v.reason || ""} ${v.full_report || ""}`;
  if (/Track\s*3|TRACK3|흥\s*칫\s*뿡|본장\s*첫\s*점화|수급\s*점화/i.test(txt)) return "TRACK3";
  if (/Track\s*B|TRACK2|숏스퀴즈/i.test(txt)) return "TRACK2";
  if (/실전\s*포지션/i.test(String(v.engine || ""))) return "POSITION";
  return "TRACK1";
}

function trackBadgeHtml(trk) {
  if (trk === "TRACK3") return `<span class="trk-badge trk-3">🟣 트랙3 흥칫뿡</span>`;
  if (trk === "TRACK2") return `<span class="trk-badge trk-2">🟠 트랙2</span>`;
  if (trk === "POSITION") return `<span class="trk-badge trk-pos">💼 실전정산</span>`;
  return `<span class="trk-badge trk-1">🔵 트랙1 PR</span>`;
}

function fmtShortDate(d) {
  if (!d) return "-";
  const p = String(d).split("-");
  return p.length === 3 ? `${Number(p[1])}/${Number(p[2])}` : d;
}

function chartUrl(sym, ex) {
  const s = encodeURIComponent(String(sym || "").trim().toUpperCase());
  const pref = String(ex || "").toUpperCase().includes("AM") ? "AMEX" : "NASDAQ";
  return `https://www.tradingview.com/chart/?symbol=${pref}%3A${s}`;
}

function setFilter(m) {
  filterMode = m;
  ["all", "hot", "track3", "track1"].forEach(k => {
    const id = k === "all" ? "fAll" : (k === "hot" ? "fHot" : (k === "track3" ? "fT3" : "fT1"));
    const el = document.getElementById(id);
    if (el) el.classList.toggle("active", k === m);
  });
  if (cachedState) renderTimeline(cachedState);
}

function toggleSort() {
  sortAsc = !sortAsc;
  document.getElementById("sortBtn").innerText = sortAsc
    ? "🕒 발생 순서대로 (오전→오후)"
    : "⬇️ 최신 순서대로 (최근→과거)";
  if (cachedState) renderTimeline(cachedState);
}

function openModal(v) {
  const trk = detectTrack(v);
  document.getElementById("mTitle").innerText = `${v.symbol} (${v.exchange || 'ND'}) · ${v.decision === 'BUY' ? '🔥 BUY' : '🛡️ 패스'}`;
  const px = Number(v.price || 0);
  const gn = Number(v.gain_pct || 0);
  const mc = Number(v.mcap_m || 0);
  document.getElementById("mMeta").innerText =
    `${trk} · ${fmtShortDate(v.date_et)}(${v.weekday_kr || ''}) 🇰🇷 ${v.time_kst || '-'} KST / 🇺🇸 ${v.time_et || '-'} ET` +
    (px > 0 ? ` · $${px.toFixed(4)} (${gn>=0?'+':''}${gn.toFixed(1)}%)` : "") +
    (mc > 0 ? ` · 시총 $${mc.toFixed(1)}M` : "");
  document.getElementById("mReason").innerText = v.reason || "-";
  const full = String(v.full_report || "").trim();
  const fullEl = document.getElementById("mFull");
  if (full.length > 5) {
    fullEl.style.display = "block";
    fullEl.innerText = full;
  } else {
    fullEl.style.display = "none";
  }
  document.getElementById("detailModal").classList.add("open");
}

function closeModal() {
  document.getElementById("detailModal").classList.remove("open");
}

function renderBoard(state) {
  if (!state) return;
  cachedState = state;

  // 1) 보유 & 계좌 1줄 스트립
  const acc = state.account || {};
  const cash = Number(acc.cash_usd || 0);
  const sess = acc.session_label || "미국장 대기";
  const upd = state.updated_kst ? state.updated_kst.slice(11, 16) : "";
  document.getElementById("radarLeftTxt").innerText =
    `📡 ${sess} · 가용 $${cash.toLocaleString(undefined, {maximumFractionDigits: 0})}` + (upd ? ` · 갱신 ${upd}` : "");

  const pill = document.getElementById("radarPosPill");
  const hSym = String(acc.holding_symbol || "").trim();
  const hQty = Number(acc.holding_qty || 0);
  const halt = state.halt_watch || {};
  if (halt.active && halt.symbol) {
    isHalting = true;
    haltStartMs = Number(halt.started_ms || Date.now());
    pill.className = "pos-badge halting";
    pill.innerText = `⏸️ ${halt.symbol} 홀트 감시 중`;
  } else if (hSym && hQty > 0) {
    isHalting = false;
    const avg = Number(acc.avg_price || 0);
    const cur = Number(acc.current_price || 0);
    const pf = avg > 0 && cur > 0 ? ((cur - avg) / avg * 100) : Number(acc.pl_rate || 0);
    pill.className = "pos-badge holding";
    pill.innerText = `💼 ${hSym} ${hQty}주 · $${cur.toFixed(4)} (${pf>=0?'+':''}${pf.toFixed(2)}%)`;
  } else {
    isHalting = false;
    pill.className = "pos-badge";
    pill.innerText = acc.daily_done ? "✅ 금일 매매 완료" : "🎯 트랙1 · 트랙3 사냥 대기 중";
  }

  // 2) 실시간 분석/홀트 배너 (필요할 때만 표시)
  const an = state.analyzing || {};
  const banner = document.getElementById("liveAlertBanner");
  if (an.active && an.symbol) {
    isAnalyzing = true;
    analyzingStartMs = Number(an.started_ms || Date.now());
    banner.style.display = "block";
    document.getElementById("liveAlertTitle").innerText = `⚡ 트랙1 실시간 심문 중: ${an.symbol} (${an.exchange || 'ND'})`;
    document.getElementById("liveAlertBody").innerText = an.catalyst_hint || "NotebookLM 8대 1급 호재 심사 진행 중...";
  } else if (halt.active && halt.symbol) {
    isAnalyzing = false;
    banner.style.display = "block";
    document.getElementById("liveAlertTitle").innerText = `⏸️ 거래소 홀트 감지: ${halt.symbol}`;
    document.getElementById("liveAlertBody").innerText = halt.reason || "홀트 해제 첫 체결 0.5초 감시 중";
  } else {
    isAnalyzing = false;
    banner.style.display = "none";
  }

  // 3) 오늘의 트랙1 · 트랙3 핵심 포착 요약 스트립
  const verdicts = Array.isArray(state.verdicts) ? state.verdicts : [];
  const latestDate = state.today_et || (verdicts[0] && verdicts[0].date_et) || "";
  const todayRows = verdicts.filter(v => !latestDate || v.date_et === latestDate);

  // 오늘 날짜 발생 순서대로 정렬 (오래된 것 -> 최신 것)
  const todayChron = [...todayRows].sort((a, b) =>
    String(a.time_et || "").localeCompare(String(b.time_et || ""))
  );

  const t3Hits = todayChron.filter(v => detectTrack(v) === "TRACK3");
  const t1Buys = todayChron.filter(v => detectTrack(v) === "TRACK1" && v.decision === "BUY");
  const hotToday = todayChron.filter(v => detectTrack(v) === "TRACK3" || (detectTrack(v) === "TRACK1" && v.decision === "BUY"));

  document.getElementById("hlTitle").innerText =
    `⚡ ${fmtShortDate(latestDate)} 트랙1 · 트랙3 핵심 신호 (발생 순서대로)`;
  document.getElementById("cntT3").innerText = `🟣 트랙3: ${t3Hits.length}건`;
  document.getElementById("cntT1Buy").innerText = `🔵 트랙1 BUY: ${t1Buys.length}건`;
  document.getElementById("cntT1All").innerText = `오늘 전체 ${todayRows.length}건`;

  const strip = document.getElementById("hlStrip");
  if (hotToday.length === 0) {
    strip.innerHTML = `<div class="hl-empty">아직 ${fmtShortDate(latestDate)} 기준 포착된 <b>BUY / 트랙3</b> 신호가 없습니다. 장중에 뜨면 여기 시간순으로 바로 쌓입니다!</div>`;
  } else {
    strip.innerHTML = "";
    hotToday.forEach((v, idx) => {
      const trk = detectTrack(v);
      const div = document.createElement("div");
      div.className = `hl-item ${trk === "TRACK3" ? "t3" : "t1"}`;
      const gn = Number(v.gain_pct || 0);
      const px = Number(v.price || 0);
      const etHm = String(v.time_et || "").slice(0, 5);
      div.innerHTML = `
        <span class="hl-time">#${idx + 1} · ${etHm ? etHm + ' ET' : (v.time_kst?.slice(0,5) || '')}</span>
        ${trackBadgeHtml(trk)}
        <span class="hl-sym">${v.symbol}</span>
        ${px > 0 ? `<span class="hl-gain ${gn < 0 ? 'neg' : ''}">$${px.toFixed(2)} (${gn>=0?'+':''}${gn.toFixed(1)}%)</span>` : ""}
        <a class="chart-btn" href="${chartUrl(v.symbol, v.exchange)}" target="_blank" onclick="event.stopPropagation()">📈 차트</a>
      `;
      div.onclick = () => openModal(v);
      strip.appendChild(div);
    });
  }

  // 4) 메인 타임라인 렌더링
  renderTimeline(state);
}

function renderTimeline(state) {
  const listEl = document.getElementById("timelineList");
  const verdicts = Array.isArray(state.verdicts) ? state.verdicts : [];

  let rows = verdicts.filter(v => {
    const trk = detectTrack(v);
    if (filterMode === "hot") return trk === "TRACK3" || v.decision === "BUY";
    if (filterMode === "track3") return trk === "TRACK3";
    if (filterMode === "track1") return trk === "TRACK1";
    return true;
  });

  if (rows.length === 0) {
    listEl.innerHTML = `<div style="padding:28px; text-align:center; color:#64748B; font-weight:700;">해당 조건의 신호 기록이 아직 없습니다.</div>`;
    return;
  }

  // 날짜별 그룹화 (최신 날짜가 위로, 각 날짜 내부는 sortAsc에 따라 발생순 또는 최신순)
  const groups = new Map();
  rows.forEach(v => {
    const d = v.date_et || "기타";
    if (!groups.has(d)) groups.set(d, []);
    groups.get(d).push(v);
  });

  const sortedDates = Array.from(groups.keys()).sort((a, b) => b.localeCompare(a));
  listEl.innerHTML = "";

  sortedDates.forEach(d => {
    const dayItems = groups.get(d);
    dayItems.sort((a, b) => {
      const ta = String(a.time_et || "");
      const tb = String(b.time_et || "");
      return sortAsc ? ta.localeCompare(tb) : tb.localeCompare(ta);
    });

    const wk = dayItems[0]?.weekday_kr || "";
    const buyCnt = dayItems.filter(x => x.decision === "BUY" || detectTrack(x) === "TRACK3").length;
    const divHead = document.createElement("div");
    divHead.className = "date-divider";
    divHead.innerHTML = `
      <span>📅 ${fmtShortDate(d)} (${wk}) · 총 ${dayItems.length}건</span>
      <span style="color:#7C3AED;">핵심 포착 ${buyCnt}건</span>
    `;
    listEl.appendChild(divHead);

    dayItems.forEach(v => {
      const trk = detectTrack(v);
      const isBuy = v.decision === "BUY";
      const row = document.createElement("div");
      row.className = "sig-row " + (trk === "TRACK3" ? "is-t3" : (isBuy ? "is-buy" : "is-pass"));

      const px = Number(v.price || 0);
      const gn = Number(v.gain_pct || 0);
      const kstHm = String(v.time_kst || "-").slice(0, 5);
      const etHm = String(v.time_et || "-").slice(0, 5);
      const decHtml = trk === "TRACK3"
        ? `<span class="dec-badge dec-buy">🚀 포착</span>`
        : (isBuy ? `<span class="dec-badge dec-buy">🔥 BUY</span>` : `<span class="dec-badge dec-pass">🛡️ 패스</span>`);

      row.innerHTML = `
        <div class="col-time">
          <div class="kst">🇺🇸 ${etHm} ET</div>
          <div class="et">🇰🇷 ${kstHm} KST</div>
        </div>
        <div class="col-trk">
          ${trackBadgeHtml(trk)}
          <div style="margin-top:4px;">${decHtml}</div>
        </div>
        <div class="col-sym">
          <div class="sym-line">
            <span class="sym">${v.symbol}</span>
            <span class="ex">${v.exchange || 'ND'}</span>
          </div>
          <div class="px">${px > 0 ? `$${px.toFixed(3)} (${gn>=0?'+':''}${gn.toFixed(1)}%)` : (v.company_name || '-')}</div>
        </div>
        <div class="col-reason">${v.reason || '-'}</div>
        <div class="col-act">
          <a class="chart-btn" href="${chartUrl(v.symbol, v.exchange)}" target="_blank" onclick="event.stopPropagation()">📈 차트</a>
        </div>
      `;
      row.onclick = () => openModal(v);
      listEl.appendChild(row);
    });
  });
}

async function pollGitHubState() {
  try {
    const stateUrl = window.location.protocol === "file:"
      ? "https://simikai1024-hue.github.io/stock-board/us_live_state.json"
      : "./us_live_state.json";
    const res = await fetch(`${stateUrl}?t=${Date.now()}`, { cache: "no-store" });
    if (res.ok) {
      const state = await res.json();
      renderBoard(state);
    }
  } catch (e) {}
}

function forceRefreshNow() {
  pollGitHubState();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.update())).catch(() => {});
  }
}

pollGitHubState();
setInterval(pollGitHubState, 10000);

/* Service Worker 업데이트 시 자동 새로고침 */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    window.location.reload();
  });
}

/* EMQX 실시간 웹소켓 */
const client = mqtt.connect(BROKER_WSS, {
  clientId: "us_board_v23_" + Math.random().toString(16).slice(2, 10),
  clean: true,
  reconnectPeriod: 2000,
});

client.on("connect", () => {
  const st = document.getElementById("statusLbl");
  st.innerText = "🟢 실시간 연결됨";
  st.classList.add("ok");
  client.subscribe([TOPIC_US_STATE, TOPIC_US_LIVE], { qos: 1 });
});

client.on("reconnect", () => {
  const st = document.getElementById("statusLbl");
  st.innerText = "🟡 재연결 중...";
  st.classList.remove("ok");
});

client.on("message", (topic, payload) => {
  try {
    const data = JSON.parse(new TextDecoder("utf-8").decode(payload));
    if (topic === TOPIC_US_STATE) {
      renderBoard(data);
    } else if (topic === TOPIC_US_LIVE && data) {
      if (data.id && seenLiveIds.has(data.id)) return;
      if (data.id) seenLiveIds.add(data.id);
      if (data.event === "VERDICT_BUY") playChime(true);
    }
  } catch (e) {}
});
</script>
