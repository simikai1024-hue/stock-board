name: "☁️ 국장 ISI 주도테마·종가베팅 무PC 백업 업데이터"

on:
  workflow_dispatch:
    inputs:
      force:
        description: "집 PC 송출 시간과 무관하게 즉시 강제 갱신"
        required: false
        default: "true"
  schedule:
    # 평일 한국 정규장 09:00~14:59 KST (= 00:00~05:59 UTC): 15분마다 집 PC 오프라인 여부 점검 후 백업 갱신
    - cron: "*/15 0-5 * * 1-5"
    # 평일 15:00~15:35 KST (= 06:00~06:35 UTC, 15:19 종가베팅 골든타임): 5분마다 정밀 백업 갱신
    - cron: "0,5,10,15,20,25,30,35 6 * * 1-5"
    # 평일 16:10 KST (= 07:10 UTC): 외인·기관 최종 확정 수급 마감 정산 백업
    - cron: "10 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: isi-cloud-backup
  cancel-in-progress: false

jobs:
  update-isi-board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout stock-board
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight dependencies
        run: pip install --quiet requests paho-mqtt

      - name: Run ISI Top 3 & 15:19 Leader Cloud Updater
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: python scripts/cloud_isi_updater.py

      - name: Commit & Push live_state.json (with conflict rebase retry)
        run: |
          if git diff --quiet live_state.json; then
            echo "변경 사항 없음 (집 PC가 실시간 가동 중이거나 동일 데이터)"
            exit 0
          fi
          git config user.name "moon-sword-cloud-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3 4; do
            git add live_state.json
            git commit -m "chore(isi-cloud): auto-update KR ISI Top3 & 15:19 leader" || true
            if git push origin HEAD:main; then
              echo "✅ GitHub 클라우드 백업 반영 완료 (attempt $i)"
              exit 0
            fi
            echo "⚠️ 동시 커밋 감지 -> git pull --rebase 후 재시도 ($i)"
            git pull --rebase -X theirs origin main || {
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              python scripts/cloud_isi_updater.py --force
            }
            sleep 2
          done
          exit 1
